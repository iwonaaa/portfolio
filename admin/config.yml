backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_path: "/assets/uploads"

locale: "zh"

collections:
  - name: "site"
    label: "站点文字与设置"
    files:
      - name: "site"
        label: "全局内容"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "名字（中文）", name: "name", widget: "string" }
          - { label: "名字（英文装饰）", name: "nameEn", widget: "string" }
          - { label: "职业一句话", name: "role", widget: "string" }
          - { label: "职业（英文装饰）", name: "roleEn", widget: "string" }
          - { label: "签名语", name: "tagline", widget: "string" }
          - { label: "所在地 · 状态", name: "location", widget: "string" }
          - { label: "封皮下方小字", name: "heroNote", widget: "string" }
          - label: "手账页签介绍"
            name: "notebook"
            widget: "object"
            fields:
              - { label: "AE动画页", name: "ae", widget: "text" }
              - { label: "角色IP页", name: "ip", widget: "text" }
              - { label: "毕业设计页", name: "thesis", widget: "text" }
          - label: "关于我（每段一条）"
            name: "about"
            widget: "list"
            field: { label: "段落", name: "p", widget: "text" }
          - label: "技能条"
            name: "skills"
            widget: "list"
            fields:
              - { label: "软件名", name: "name", widget: "string" }
              - { label: "等级（0-100）", name: "level", widget: "number", min: 0, max: 100, value_type: "int" }
          - label: "软件徽章（每枚一条）"
            name: "software"
            widget: "list"
            field: { label: "徽章", name: "s", widget: "string" }
          - label: "经历时间线"
            name: "timeline"
            widget: "list"
            fields:
              - { label: "时间段", name: "period", widget: "string", hint: "如 2025.06 — 2025.12" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "公司/学校", name: "org", widget: "string" }
              - { label: "描述", name: "desc", widget: "text" }
          - label: "联系方式"
            name: "contact"
            widget: "object"
            fields:
              - { label: "邮箱", name: "email", widget: "string" }
              - { label: "电话", name: "phone", widget: "string" }
              - { label: "微信", name: "wechat", widget: "string" }
              - { label: "简历 PDF 链接", name: "resumeUrl", widget: "string", required: false, hint: "把 resume.pdf 传到素材库后填 /assets/uploads/resume.pdf" }
              - { label: "B站主页", name: "bilibili", widget: "string", required: false }
          - { label: "背景音乐 mp3 链接", name: "music", widget: "string", required: false, hint: "素材库上传 mp3 后填它的地址，留空则无背景音乐" }
          - { label: "音效默认开启", name: "soundOn", widget: "boolean", default: false }

  - name: "works"
    label: "作品（视频卡）"
    files:
      - name: "works"
        label: "作品列表"
        file: "content/works.json"
        format: "json"
        fields:
          - label: "作品"
            name: "works"
            label_singular: "作品"
            widget: "list"
            fields:
              - { label: "ID（唯一英文）", name: "id", widget: "string", hint: "如 w9，别和别的作品重复" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "英文名（装饰小字）", name: "en", widget: "string" }
              - { label: "分类", name: "cat", widget: "select", options: ["动效", "特效", "动画", "其他"] }
              - { label: "年份", name: "year", widget: "string" }
              - { label: "时长", name: "dur", widget: "string", hint: "格式如 00:45" }
              - { label: "我的职责", name: "role", widget: "string" }
              - { label: "使用软件", name: "tools", widget: "string" }
              - { label: "介绍", name: "desc", widget: "text" }
              - { label: "封面图", name: "poster", widget: "image" }
              - { label: "视频文件（mp4）", name: "video", widget: "file", required: false }
              - { label: "初始点赞数", name: "likes", widget: "number", value_type: "int", default: 0 }

  - name: "postcards"
    label: "明信片堆（图片作品）"
    files:
      - name: "postcards"
        label: "明信片堆列表"
        file: "content/postcards.json"
        format: "json"
        fields:
          - label: "明信片堆"
            name: "postcards"
            label_singular: "明信片堆"
            widget: "list"
            fields:
              - { label: "ID（唯一英文）", name: "id", widget: "string", hint: "如 pc3" }
              - { label: "标题", name: "title", widget: "string" }
              - { label: "英文名（装饰小字）", name: "en", widget: "string" }
              - label: "卡片"
                name: "cards"
                label_singular: "卡片"
                widget: "list"
                fields:
                  - { label: "图片", name: "img", widget: "image" }
                  - { label: "图注", name: "note", widget: "string" }